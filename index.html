<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editor IA</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: white; padding: 20px; }
        .upload-box { border: 2px dashed #555; padding: 20px; text-align: center; margin-bottom: 20px; border-radius: 10px;}
        #timeline { display: flex; overflow-x: auto; height: 100px; background: #2d2d2d; border-radius: 5px; margin-top: 20px; padding: 10px; align-items: center; gap: 2px;}
        .clip { height: 80px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: black; font-weight: bold; cursor: pointer; min-width: 30px; transition: 0.2s;}
        .good { background-color: #4CAF50; }
        .silence { background-color: #F44336; opacity: 0.7; }
        .filler { background-color: #FFC107; }
        /* Nueva clase para los bloques que el usuario decide eliminar */
        .deleted { background-color: #555 !important; opacity: 0.3; } 
        .btn-export { margin-top: 20px; padding: 10px 20px; background-color: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; display: none;}
    </style>
</head>
<body>

    <h1>🎬 Mi Editor de Video con IA</h1>
    
    <div class="upload-box">
        <input type="file" id="videoInput" accept="video/mp4,video/mov">
        <button onclick="procesarVideo()" style="padding: 10px; cursor: pointer;">Generar Línea de Tiempo Mágica</button>
        <p id="status">Sube un video para comenzar...</p>
    </div>

    <h3>Línea de Tiempo Editable (Haz clic para eliminar/recuperar):</h3>
    <div id="timeline"></div>
    
    <!-- Nuevo botón para exportar -->
    <button id="btnExportar" class="btn-export" onclick="exportarVideo()">Exportar Video Final</button>

    <script>
        let clipsActuales = [];

        async function procesarVideo() {
            const file = document.getElementById('videoInput').files[0];
            if (!file) return alert("Selecciona un video primero");

            document.getElementById('status').innerText = "Procesando con IA (Esto puede tardar unos segundos)...";
            document.getElementById('timeline').innerHTML = "";
            document.getElementById('btnExportar').style.display = 'none';

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch("/upload-and-extract/", { method: "POST", body: formData });
                const data = await response.json();

                if (data.status === "success") {
                    document.getElementById('status').innerText = "¡Proceso terminado! Haz clic en los bloques para editar.";
                    dibujarTimeline(data.timeline);
                } else {
                    document.getElementById('status').innerText = "Error procesando.";
                }
            } catch (e) {
                document.getElementById('status').innerText = "Error de conexión.";
            }
        }

        function dibujarTimeline(timelineData) {
            const container = document.getElementById('timeline');
            
            clipsActuales = [...timelineData.spoken_segments, ...timelineData.cuts_to_make];
            clipsActuales.sort((a, b) => a.start - b.start);

            clipsActuales.forEach((clip) => {
                const div = document.createElement('div');
                div.className = 'clip';
                
                const duration = clip.end - clip.start;
                div.style.width = (duration * 20) + 'px';

                // La IA pre-selecciona qué eliminar (silencios y muletillas)
                let eliminado = false;
                if (clip.type === "silence_cut") {
                    div.classList.add('silence');
                    eliminado = true;
                } else if (clip.flag_filler) {
                    div.classList.add('filler');
                    eliminado = true;
                } else {
                    div.classList.add('good');
                }

                if (eliminado) {
                    div.classList.add('deleted');
                    clip.keep = false;
                } else {
                    clip.keep = true;
                }

                div.title = (clip.text || "Silencio") + ` (${duration.toFixed(1)}s)`;

                // Interactividad: Al hacer clic, alternamos entre guardarlo o eliminarlo
                div.onclick = function() {
                    clip.keep = !clip.keep;
                    if (clip.keep) {
                        div.classList.remove('deleted');
                    } else {
                        div.classList.add('deleted');
                    }
                };

                container.appendChild(div);
            });

            // Mostramos el botón de exportar cuando la línea de tiempo está lista
            document.getElementById('btnExportar').style.display = 'block';
        }

        async function exportarVideo() {
            const clipsAExportar = clipsActuales.filter(c => c.keep);
            const filename = document.getElementById('videoInput').files[0].name;
            const btn = document.getElementById('btnExportar');

            if (clipsAExportar.length === 0) return alert("No hay fragmentos seleccionados para exportar.");

            btn.innerText = "⏳ Cortando y uniendo video (esto tardará un poco)...";
            btn.disabled = true;

            try {
                const response = await fetch("/export/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        filename: filename,
                        clips: clipsAExportar.map(c => ({ start: c.start, end: c.end }))
                    })
                });

                if (response.ok) {
                    // Magia para forzar la descarga del video resultante
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Editado_${filename}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    btn.innerText = "✅ ¡Video Descargado!";
                } else {
                    const errorData = await response.json();
                    alert("Error al exportar: " + (errorData.detail || "Error desconocido"));
                    btn.innerText = "Exportar Video Final";
                    btn.disabled = false;
                }
            } catch (e) {
                alert("Error de conexión al exportar.");
                btn.innerText = "Exportar Video Final";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
